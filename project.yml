name: AllInOne
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SUPPORTS_MACCATALYST: "NO"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  AllInOne:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - target: AllInOneKeyboard
        embed: true
      - package: Citadel
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "io.github.allinoneipa.app"
        PRODUCT_NAME: "AllInOne"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Для SSH, SFTP, локального SOCKS5 и других сетевых подключений к выбранным пользователем устройствам."
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "All-In-One"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_STYLE: "Automatic"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
  AllInOneKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeyboardExtension
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: "All-In-One Keyboard"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.keyboard-service"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            PrimaryLanguage: "ru-RU"
            IsASCIICapable: true
            RequestsOpenAccess: false
            PrefersRightToLeft: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "io.github.allinoneipa.app.keyboard"
        PRODUCT_NAME: "AllInOneKeyboard"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_STYLE: "Automatic"
        SKIP_INSTALL: "YES"
schemes:
  AllInOne:
    build:
      targets:
        AllInOne: all
    run:
      config: Debug
    archive:
      config: Release
