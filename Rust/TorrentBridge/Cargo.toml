[package]
name = "aio-torrent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "aio_torrent"
crate-type = ["staticlib"]

[dependencies]
librqbit = { git = "https://github.com/ikatson/rqbit.git", tag = "v9.0.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
panic = "abort"
strip = "debuginfo"

# Apple/iOS compatibility fix: do not call Linux SO_BINDTODEVICE on iOS.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "../vendor/librqbit-dualstack-sockets" }
