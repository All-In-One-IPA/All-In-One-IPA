name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ios-build:
    name: Unsigned iOS build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        run: swift scripts/make-icon.swift
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile application
        run: |
          set -euo pipefail
          xcodebuild -project AllInOne.xcodeproj \
            -scheme AllInOne -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/aio-ci" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check embedded keyboard extension
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/aio-ci/Build/Products/Debug-iphoneos/AllInOne.app"
          EXT="$APP/PlugIns/AllInOneKeyboard.appex"
          test -d "$EXT"
          /usr/bin/python3 - "$EXT/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              info = plistlib.load(fh)
          extension = info['NSExtension']
          assert extension['NSExtensionPointIdentifier'] == 'com.apple.keyboard-service'
          assert extension['NSExtensionAttributes']['RequestsOpenAccess'] is False
          print('Verified embedded keyboard, no Full Access request')
          PY
