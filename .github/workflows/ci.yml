name: CI

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'KeyboardExtension/**'
      - 'project.yml'
      - 'scripts/**'
      - 'Rust/**'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  ios-build:
    name: Unsigned iOS build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        run: swift scripts/make-icon.swift
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Configure Rust for iPhone ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust/TorrentBridge
      - name: Build embedded librqbit static library
        run: |
          set -euo pipefail
          cargo build --manifest-path Rust/TorrentBridge/Cargo.toml --target aarch64-apple-ios --release
          test -s Rust/TorrentBridge/target/aarch64-apple-ios/release/libaio_torrent.a
      - name: Compile application
        run: |
          set -euo pipefail
          xcodebuild -project AllInOne.xcodeproj \
            -scheme AllInOne -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/aio-ci" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check embedded keyboard extension
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/aio-ci/Build/Products/Debug-iphoneos/AllInOne.app"
          EXT="$APP/PlugIns/AllInOneKeyboard.appex"
          test -d "$EXT"
          /usr/bin/python3 - "$EXT/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              info = plistlib.load(fh)
          with open(sys.argv[1].replace('/PlugIns/AllInOneKeyboard.appex/Info.plist', '/Info.plist'), 'rb') as fh:
              parent = plistlib.load(fh)
          assert info['CFBundleVersion'] == parent['CFBundleVersion']
          assert info['CFBundleShortVersionString'] == parent['CFBundleShortVersionString']
          extension = info['NSExtension']
          assert extension['NSExtensionPointIdentifier'] == 'com.apple.keyboard-service'
          assert extension['NSExtensionAttributes']['RequestsOpenAccess'] is False
          print('Verified embedded keyboard, no Full Access request')
          PY
